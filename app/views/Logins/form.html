<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · SAL</title>

    <!-- Mesmas bibliotecas do main.html, para manter o padrão visual -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" media="screen" href="@{'/public/stylesheets/main.css'}">
    <link rel="shortcut icon" type="image/png" href="@{'/public/images/favicon.png'}">
</head>
<body>
    <div class="container" style="max-width: 420px; margin-top: 10vh;">

        <div class="text-center mb-4">
            <span class="sal-topbar-mark">SAL</span>
            <h1 class="h5 mt-3">Sistema de Agendamento de Laboratórios</h1>
            <p class="text-secondary small">IFRN · Campus João Câmara</p>
        </div>

        <!-- Mensagem de erro (login inválido OU "restrito para autenticados") -->
        #{if flash.error}
            <div class="alert alert-danger alert-dismissible fade show sal-alert" role="alert">
                <i class="bi bi-exclamation-triangle"></i> ${flash.error}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
        #{/if}

        <div class="sal-card">
            <div class="sal-card-body">
                <!-- action="@{Logins.logar}" -> chama Logins.logar(login, senha) -->
                <form action="@{Logins.logar}" method="post" class="sal-form">

                    <div class="mb-3">
                        <label class="form-label" for="login">Login</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <!-- name="login" tem que ser igual ao parâmetro do controller -->
                            <input type="text" id="login" name="login" class="form-control" required autofocus />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="senha">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="senha" name="senha" class="form-control" required />
                        </div>
                    </div>

                    <button type="submit" class="btn btn-sal-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
